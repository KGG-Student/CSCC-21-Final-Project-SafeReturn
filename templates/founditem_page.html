<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Found Item Page</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='lost_found_item.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='chat.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='notification.css') }}">
  </head>

  <body>
    <div class="form-container">
      <div class="report-title">
        <img src="{{ url_for('static', filename='images/lost_icon.png') }}" class="lost-icon">
        Found Item
      </div>

      <div class="blue-box">
        <form method="post"
              action="{{ url_for('found_item') }}"
              enctype="multipart/form-data">

          <div class="top-row">
            <div class="field-row">
              <label class="label">Item Name:</label>
              <input type="text" name="item_name" class="input-text" required>
            </div>
          </div>

          <div class="description_box">
            <div class="field-row">
              <label class="label">Description:</label>
              <textarea name="description" class="input-textarea" required></textarea>
            </div>
          </div>

          <!-- IMAGE UPLOAD -->
          <div class="image-upload-area">
            <label for="found-file-upload" class="upload-label">
              <div class="upload-text">Upload Image here</div>
            </label>

            <input id="found-file-upload"
                   name="image"
                   type="file"
                   accept="image/*"
                   hidden>

            <img id="found-image-preview"
                 class="image-preview"
                 style="display:none"
                 alt="Preview">
          </div>

          <div class="location-row">
            <label class="label">Location:</label>
            <input type="text" name="location" class="input-text" required>
          </div>

          <div class="date-field">
            <label class="label">Date Found:</label>
            <input type="date" id="date-found" name="date_found" class="input-date" required>
          </div>

          <div class="category-field">
            <label class="label">Category:</label>
            <select name="category" class="input-category" required>
              <option disabled selected value="">Select Category</option>
              <option value="electronics">Electronics</option>
              <option value="clothing">Clothing & Accessories</option>
              <option value="documents">Documents & IDs</option>
              <option value="others">Other Items</option>
            </select>
          </div>

          <div class="submit-row">
            <button type="submit" class="submit-button">Submit Found Item</button>
          </div>
        </form>
      </div>
    </div>

    <!-- FLOATING BUTTONS -->
    <div class="circle-buttons">
      <button class="crl_btn" id="notificationToggleButton">
        <img src="{{ url_for('static', filename='images/bell.png') }}" class="lost-icon">
        <span id="notifBadge" class="notif-badge" style="display:none">0</span>
      </button>

      <a href="{{ url_for('report_page') }}" class="crl_btn">
        <img src="{{ url_for('static', filename='images/Back.jpg') }}" class="lost-icon">
      </a>
    </div>

    <!-- SCRIPTS -->
    <script src="{{ url_for('static', filename='chat.js') }}"></script>
    <script src="{{ url_for('static', filename='notification.js') }}"></script>

    <!-- IMAGE PREVIEW + DATE LIMIT -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const fileInput = document.getElementById("found-file-upload");
        const preview = document.getElementById("found-image-preview");
        const uploadText = document.querySelector(".upload-text");
        const dateInput = document.getElementById("date-found");

        /* DATE LIMIT: CURRENT MONTH ONLY */
        if (dateInput) {
          const today = new Date();
          const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
          const fmt = d => d.toISOString().split("T")[0];
          dateInput.min = fmt(firstDay);
          dateInput.max = fmt(today);
        }

        if (!fileInput || !preview) return;

        fileInput.addEventListener("change", () => {
          const file = fileInput.files[0];
          if (!file || !file.type.startsWith("image/")) return;

          const reader = new FileReader();
          reader.onload = e => {
            preview.src = e.target.result;
            preview.style.display = "block";
            uploadText.textContent = "Click image to change";
          };
          reader.readAsDataURL(file);
        });

        preview.addEventListener("click", () => fileInput.click());
      });
    </script>

    {% include "components/chat_window.html" %}
  </body>
</html>
