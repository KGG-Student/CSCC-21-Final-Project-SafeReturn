<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Found Item Page</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='lost_found_item.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='chat.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='notification.css') }}"
    />
  </head>

  <body>
    <div class="form-container">
      <div class="report-title">
        <img
          src="{{ url_for('static', filename='images/lost_icon.png') }}"
          alt="Lost Icon"
          class="lost-icon"
        />
        Found Item
      </div>

      <div class="blue-box">
        <form
          method="post"
          action="{{ url_for('found_item') }}"
          enctype="multipart/form-data"
        >
          <div class="top-row">
            <div class="field-row">
              <label for="item-name" class="label">Item Name:</label>
              <input
                type="text"
                id="item-name"
                name="item_name"
                class="input-text"
                required
              />
            </div>
          </div>

          <div class="description_box">
            <div class="field-row">
              <label for="description" class="label">Description:</label>
              <textarea
                id="description"
                name="description"
                class="input-textarea"
                required
              ></textarea>
            </div>
          </div>

          <div class="image-upload-area">
            <label for="found-file-upload" class="upload-label">
              <div class="upload-text">Upload Image here</div>
            </label>
            <input
              id="found-file-upload"
              name="image"
              type="file"
              accept="image/*"
              style="display: none"
            />

            <img
              id="found-image-preview"
              class="image-preview"
              style="display: none"
              alt="Image preview"
            />
          </div>

          <div class="location-row">
            <label for="location" class="label">Location:</label>
            <input
              type="text"
              id="location"
              name="location"
              class="input-text"
              required
            />
          </div>

          <div class="date-field">
            <label for="date-found" class="label">Date Found:</label>
            <input
              type="date"
              id="date-found"
              name="date_found"
              class="input-date"
              required
            />
          </div>

          <div class="category-field">
            <label for="category" class="label">Category:</label>
            <div class="category-select-wrapper">
              <select
                id="category"
                name="category"
                class="input-category"
                required
              >
                <option disabled selected value="">Select Category</option>
                <option value="electronics">Electronics</option>
                <option value="clothing">Clothing &amp; Accessories</option>
                <option value="documents">Documents &amp; IDs</option>
                <option value="others">Other Items</option>
              </select>
            </div>
          </div>

          <div class="submit-row">
            <button type="submit" class="submit-button">
              Submit Found Item
            </button>
          </div>
        </form>
      </div>
    </div>

    {% for item in found_items %}
    <div class="item-entry">
      <a
        href="{{ url_for('item_description', item_type='found', item_id=item._id|string) }}"
        class="item-button"
      >
        <img
          src="{% if item.image_path %}{{ url_for('static', filename=item.image_path) }}{% else %}{{ url_for('static', filename='images/item.png') }}{% endif %}"
          class="item-icon"
          alt="Item Image"
        />
        <span class="item-text">{{ item.item_name }}</span>
      </a>

      {# Show Edit/Delete only for the owner of the item #} {% if
      session.get('user_id') and session.get('user_id')|int == item.user_id %}
      <div class="owner-item-actions">
        <a
          href="{{ url_for('edit_item', item_type='found', item_id=item._id|string) }}"
          class="edit-btn"
          >Edit</a
        >

        <form
          action="{{ url_for('delete_item', item_type='found', item_id=item._id|string) }}"
          method="post"
          onsubmit="return confirm('Are you sure you want to delete this item?');"
          style="display: inline"
        >
          <button type="submit" class="delete-btn">Delete</button>
        </form>
      </div>
      {% endif %}
    </div>
    {% endfor %}

    <div class="circle-buttons">
      <button type="button" class="crl_btn" id="notificationToggleButton">
  <img src="{{ url_for('static', filename='images/bell.png') }}" class="lost-icon">
  <span id="notifBadge" class="notif-badge" style="display:none">0</span>
</button>

<div class="notification-window" id="notificationWindow">
  <div class="notification-header">
    Notifications
    <button class="close-notif" id="closeNotifButton">&times;</button>
  </div>
  <div class="notification-body" id="notificationBody"></div>
</div>


      <a href="{{ url_for('report_page') }}" class="crl_btn">
        <img
          src="{{ url_for('static', filename='images/Back.jpg') }}"
          alt="Back Icon"
          class="lost-icon"
        />
      </a>
    </div>

    <script src="{{ url_for('static', filename='chat.js') }}"></script>
    <script src="{{ url_for('static', filename='notification.js') }}"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const fileInput = document.getElementById("found-file-upload");
        const previewImg = document.getElementById("found-image-preview");
        const uploadText = document.querySelector(
          ".image-upload-area .upload-text"
        );

        if (!fileInput || !previewImg) return;

        fileInput.addEventListener("change", function () {
          const file = this.files[0];

          if (!file) {
            previewImg.style.display = "none";
            previewImg.src = "";
            if (uploadText) uploadText.textContent = "Upload Image here";
            return;
          }

          if (!file.type.startsWith("image/")) {
            alert("Please select an image file.");
            this.value = "";
            previewImg.style.display = "none";
            previewImg.src = "";
            if (uploadText) uploadText.textContent = "Upload Image here";
            return;
          }

          const reader = new FileReader();
          reader.onload = function (e) {
            previewImg.src = e.target.result;
            previewImg.style.display = "block";
            if (uploadText) uploadText.textContent = "Image preview:";
          };
          reader.readAsDataURL(file);
        });
      });
    </script>
    {% include "components/chat_window.html" %}
  </body>
</html>
