<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Item</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='lost_found_item.css') }}">
</head>
<body>

<div class="form-container">

    <div class="report-title">
        <img src="{{ url_for('static', filename='images/lost_icon.png') }}" class="lost-icon" alt="Lost Icon">
        {% if item_type == 'lost' %}
            Edit Lost Item
        {% else %}
            Edit Found Item
        {% endif %}
    </div>

    <div class="blue-box">
        <form method="post"
              action="{{ url_for('edit_item', item_type=item_type, item_id=item._id|string) }}"
              enctype="multipart/form-data">

            <!-- IMAGE REPLACEMENT -->
            <div class="image-upload-area">
              <label class="upload-label">
                <div class="upload-text">Click image to replace</div>
              </label>

              <input
                type="file"
                id="edit-file-upload"
                name="image"
                accept="image/*"
                hidden
              >

              {% if item.image_path %}
                <img
                  id="edit-image-preview"
                  src="{{ url_for('static', filename=item.image_path) }}"
                  class="image-preview"
                  alt="Current image"
                >
              {% else %}
                <img
                  id="edit-image-preview"
                  class="image-preview"
                  style="display:none"
                >
              {% endif %}
            </div>

            <div class="top-row">
                <div class="field-row">
                    <label class="label">Item Name:</label>
                    <input
                        type="text"
                        name="item_name"
                        class="input-text"
                        value="{{ item.item_name }}"
                        required>
                </div>
            </div>

            <div class="description_box">
                <div class="field-row">
                    <label class="label">Description:</label>
                    <textarea
                        name="description"
                        class="input-textarea"
                        required>{{ item.description }}</textarea>
                </div>
            </div>

            <div class="location-row">
                <label class="label">Location:</label>
                <input
                    type="text"
                    name="location"
                    class="input-text"
                    value="{{ item.location }}"
                    required>
            </div>

            <div class="date-field">
                <label class="label">
                    {% if item_type == 'lost' %}Date Lost:{% else %}Date Found:{% endif %}
                </label>

                {% if item_type == 'lost' %}
                    <input type="date" name="date_lost" class="input-date" value="{{ item.date_lost }}" required>
                {% else %}
                    <input type="date" name="date_found" class="input-date" value="{{ item.date_found }}" required>
                {% endif %}
            </div>

            <div class="category-field">
                <label class="label">Category:</label>
                <select name="category" class="input-category" required>
                    <option value="electronics" {% if item.category == 'electronics' %}selected{% endif %}>Electronics</option>
                    <option value="clothing" {% if item.category == 'clothing' %}selected{% endif %}>Clothing</option>
                    <option value="documents" {% if item.category == 'documents' %}selected{% endif %}>Documents</option>
                    <option value="others" {% if item.category == 'others' %}selected{% endif %}>Others</option>
                </select>
            </div>

            <div class="submit-row" style="gap:15px;">
                <a href="{{ url_for('item_description', item_type=item_type, item_id=item._id|string) }}"
                   class="submit-button"
                   style="background:#fff;color:#004ebf;border-color:#004ebf;text-decoration:none;">
                   Cancel
                </a>

                <button type="submit" class="submit-button">
                    Save Changes
                </button>
            </div>

        </form>
    </div>
</div>

<!-- IMAGE PREVIEW JS -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const fileInput = document.getElementById("edit-file-upload");
  const previewImg = document.getElementById("edit-image-preview");

  if (!fileInput || !previewImg) return;

  previewImg.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file || !file.type.startsWith("image/")) return;

    const reader = new FileReader();
    reader.onload = e => {
      previewImg.src = e.target.result;
      previewImg.style.display = "block";
    };
    reader.readAsDataURL(file);
  });
});
</script>

{% include "components/chat_window.html" %}
</body>
</html>
