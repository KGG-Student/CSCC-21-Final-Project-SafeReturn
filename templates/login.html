<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-title">
            <img src="{{ url_for('static', filename='images/lost_icon.png') }}" alt="Logo" class="lost-icon">
            Login Page
        </div>

        <div class="textbox">
            <form method="post" action="{{ url_for('login') }}">
                <div class="input-group">
                    <label for="id-number">ID Number:</label>
<input
  type="text"
  id="id-number"
  name="id_number"
  required
  inputmode="numeric"
  pattern="[0-9]*"
  autocomplete="off"
/>


                </div>

                <div class="input-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="login_buttons">
                    <a href="{{ url_for('register') }}" class="log_btn">Sign Up</a>

                    <button type="submit" class="log_btn">Sign In</button>
                </div>
                <div class="forgot-password">
  <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
  
</div>

            </form>
        </div>
    </div>

    <div id="errorModal"
         class="modal-overlay{% if error_message %} show{% endif %}">
        <div class="modal-box">
            <h2>Login Failed</h2>
            <p>{{ error_message }}</p>
            <button id="modalOkBtn" class="modal-btn">OK</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const modal = document.getElementById("errorModal");
            const okBtn = document.getElementById("modalOkBtn");

            if (modal && okBtn) {
                okBtn.addEventListener("click", function () {
                    modal.classList.remove("show");
                });
            }
        });
    </script>
    <script>
document.addEventListener("DOMContentLoaded", function () {
  const idInput = document.getElementById("id-number");

  if (idInput) {
    idInput.addEventListener("input", () => {
      idInput.value = idInput.value.replace(/\D/g, "");
    });
  }
});
</script>

</body>
</html>
