<!DOCTYPE html>
<html>
<head>
  <title>Registration Page</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
</head>

<body>

<div class="register-container">

  <!-- TITLE -->
  <div class="register-title">
    <img src="{{ url_for('static', filename='images/lost_icon.png') }}"
         alt="Logo"
         class="lost-icon">
    Registration Page
  </div>

  <!-- FORM BOX -->
  <div class="blue-box">
    <form method="post" action="{{ url_for('register') }}">

      <!-- ID NUMBER -->
      <div class="input-group">
        <label for="id-number">ID Number:</label>
        <input
          type="text"
          id="id-number"
          name="id_number"
          required
          inputmode="numeric"
          pattern="[0-9]*"
          autocomplete="off"
        >
      </div>

      <!-- NAME -->
      <div class="input-group">
        <label for="user-name">Name:</label>
        <input type="text" id="user-name" name="username" required>
      </div>

      <!-- EMAIL -->
      <div class="input-group">
        <label for="user-email">Email:</label>
        <input type="email" id="user-email" name="email" required>
      </div>

      <!-- PASSWORD -->
      <div class="input-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div class="input-group">
        <label for="confirm-password">Confirm Password:</label>
        <input type="password"
               id="confirm-password"
               name="confirm_password"
               required>
      </div>

      <!-- BUTTONS -->
      <div class="register_buttons">
        <a href="{{ url_for('login') }}" class="reg_btn">Cancel</a>
        <button type="submit" class="reg_btn">Register</button>
      </div>

    </form>
  </div>
</div>

<!-- ERROR MODAL -->
<div id="errorModal"
     class="modal-overlay{% if error_message %} show{% endif %}">
  <div class="modal-box">
    <h2>Registration Error</h2>
    <p>{{ error_message }}</p>
    <button id="modalOkBtn" class="modal-btn">OK</button>
  </div>
</div>

<!-- SUCCESS MODAL -->
<div id="successModal"
     class="modal-overlay{% if success_message %} show{% endif %}">
  <div class="modal-box">
    <h2>Success!</h2>
    <p>{{ success_message }}</p>
    <button id="successOkBtn" class="modal-btn">OK</button>
  </div>
</div>

<!-- JS -->
<script>
document.addEventListener("DOMContentLoaded", () => {

  /* ID NUMBER – DIGITS ONLY */
  const idInput = document.getElementById("id-number");
  if (idInput) {
    idInput.addEventListener("input", () => {
      idInput.value = idInput.value.replace(/\D/g, "");
    });
  }

  /* ERROR MODAL */
  const errorModal = document.getElementById("errorModal");
  const errorBtn = document.getElementById("modalOkBtn");
  if (errorModal && errorBtn) {
    errorBtn.onclick = () => errorModal.classList.remove("show");
  }

  /* SUCCESS MODAL */
  const successModal = document.getElementById("successModal");
  const successBtn = document.getElementById("successOkBtn");
  if (successModal && successBtn) {
    successBtn.onclick = () => {
      successModal.classList.remove("show");
      window.location.href = "{{ url_for('login') }}";
    };
  }
});
</script>

</body>
</html>
