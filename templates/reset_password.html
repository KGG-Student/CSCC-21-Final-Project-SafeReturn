<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

<div class="login-container">
  <div class="login-title">Reset Password</div>

  <div class="textbox">
    <form id="resetForm" method="post" action="{{ url_for('reset_password_submit') }}">

      <input type="hidden" name="token" value="{{ token }}">

      <div class="input-group">
        <label>New Password:</label>
        <input type="password" name="password" required>
      </div>

      <div class="input-group">
        <label>Confirm Password:</label>
        <input type="password" name="confirm_password" required>
      </div>

      <div class="login_buttons">
        <button type="button" class="log_btn" id="openConfirmReset">
          Update Password
        </button>
      </div>

    </form>
  </div>
</div>

<!-- RESET CONFIRMATION MODAL -->
<div id="resetConfirmModal" class="modal-overlay">
  <div class="modal-box">
    <h2>Confirm Password Reset</h2>
    <p>Are you sure you want to update your password?</p>

    <div class="modal-actions">
      <button id="cancelReset" class="log_btn">Cancel</button>
      <button id="confirmReset" class="log_btn">Confirm</button>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const openBtn = document.getElementById("openConfirmReset");
  const modal = document.getElementById("resetConfirmModal");
  const cancelBtn = document.getElementById("cancelReset");
  const confirmBtn = document.getElementById("confirmReset");
  const form = document.getElementById("resetForm");

  openBtn.addEventListener("click", () => {
    modal.classList.add("show");
  });

  cancelBtn.addEventListener("click", () => {
    modal.classList.remove("show");
  });

  confirmBtn.addEventListener("click", () => {
    form.submit();
  });
});
</script>

</body>
</html>
